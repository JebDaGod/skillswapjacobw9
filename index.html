<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Swap</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Skill Swap</h1>
        <p>Learn new skills by sharing what you know.</p>
    </header>

    <main>
        <section id="about">
            <h2>About Skill Swap</h2>
            <p>
                Skill Swap connects students and recent graduates
                who want to exchange skills, share knowledge, and
                help each other succeed.
            </p>
        </section>

        <section id="skills-section">
            <h2>Explore Skills</h2>

            <div class="filter-buttons">
                <button class="filter-btn active" data-category="All">All</button>
                <button class="filter-btn" data-category="Programming">Programming</button>
                <button class="filter-btn" data-category="Music">Music</button>
                <button class="filter-btn" data-category="Career">Career</button>
            </div>

            <div id="skills-container" class="skills-container">
                <!-- Skill cards will be displayed here -->
            </div>
        </section>

        <section id="skills">
            <h2>Explore Skills</h2>
            <p>Discover skills you can learn or teach.</p>
            <button id="exploreButton">Explore Skills</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Skill Swap</p>
    </footer>
</body>

</html>
